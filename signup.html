<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeStream | Sign Up</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tailwind CSS 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#D2143A',
            secondary: 'var(--secondary-navy)',
            accent: '#E6A23C',
            softIvory: 'var(--bg-ivory)',
            cardWhite: 'var(--card-white)',
            darkSlate: 'var(--text-slate)',
            primaryHover: '#B10E2E',
            secondaryHover: '#0F172A',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Manrope', 'sans-serif'],
          },
          fontSize: {
            '2xs': '0.675rem',
            '3xs': '0.55rem',
            'xs': '0.8rem',
            'sm': '0.925rem',
            'base': '1.05rem',
            'lg': '1.175rem',
          }
        }
      }
    }
  </script>
  
  <script>
    (function() {
      var saved = localStorage.getItem("hospital-theme");
      var isDark = saved === "dark" || (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    })();
  </script>
  
  <!-- Custom Styles CSS -->
  <link class="style-ref" rel="stylesheet" href="css/style.css">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-white to-primary/5 dark:from-[#0E1620] dark:to-[#1E293B]/10 text-darkSlate dark:text-gray-200 min-h-screen py-20 flex items-center justify-center transition-colors duration-300 relative">

  <!-- External Language & Theme Toggles (Top Right Corner) -->
  <div class="absolute top-6 right-6 flex gap-3 z-50">
    <button id="lang-toggle-btn"
      class="p-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-cardWhite rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 shadow-sm"
      title="Toggle Language/RTL">
      <i data-lucide="arrow-left-right" class="w-4 h-4 text-primary"></i>
    </button>
    <button id="theme-toggle-btn"
      class="p-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-cardWhite rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 shadow-sm">
      <i id="theme-toggle-icon" data-lucide="moon" class="w-4 h-4 text-primary"></i>
    </button>
  </div>

  <div class="w-full max-w-md mx-auto px-4">
    <div class="bg-white dark:bg-cardWhite rounded-2xl border border-gray-100 dark:border-gray-800 p-8 shadow-xl">
      
      <!-- Brand Logo Header -->
      <div class="flex flex-col items-center mb-6 text-center">
        <a href="index.html" class="flex items-center justify-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/20">
            <i data-lucide="droplet" class="w-5 h-5"></i>
          </div>
          <span class="font-heading text-lg font-extrabold text-secondary dark:text-white leading-tight tracking-tight">LifeStream</span>
        </a>
        <h2 class="text-2xl font-extrabold text-secondary dark:text-white" data-translate="signupTitle">Register Account</h2>
        <p class="text-xs text-gray-400 mt-1">Join as a blood donor or community volunteer</p>
      </div>

      <!-- Registration Form -->
      <form id="signup-form" class="space-y-4">
        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Full Name*</label>
          <input id="signup-name" type="text" placeholder="" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Email*</label>
          <input id="signup-email" type="email" placeholder="" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Mobile Number*</label>
          <input id="signup-phone" type="tel" placeholder="" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Date of Birth*</label>
          <input id="signup-dob" type="date" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Gender*</label>
          <select id="signup-gender" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Female</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Male</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Blood Group*</label>
          <select id="signup-blood" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">A+</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">A-</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">B+</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">B-</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">O+</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">O-</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">AB+</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">AB-</option>
          </select>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Role Interest*</label>
          <select id="signup-role" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg text-sm text-secondary dark:text-white" required>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Donor</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Volunteer</option>
            <option class="bg-white dark:bg-cardWhite text-secondary dark:text-white">Both</option>
          </select>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Password*</label>
          <div class="relative">
            <input id="signup-password" type="password" placeholder="" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 pr-10 rounded-lg text-sm text-secondary dark:text-white" required>
            <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-2xs uppercase tracking-wider text-gray-400 font-bold mb-1">Confirm Password*</label>
          <div class="relative">
            <input id="signup-confirm-password" type="password" placeholder="" class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 pr-10 rounded-lg text-sm text-secondary dark:text-white" required>
            <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <label class="flex items-start gap-2 text-2xs text-gray-500 pt-2">
          <input id="signup-agree" type="checkbox" class="mt-0.5 rounded border-gray-300 text-primary" required>
          <span>I agree to the Terms & Conditions and consent to register as a LifeStream donor/volunteer.</span>
        </label>

        <button type="submit" class="w-full py-3.5 bg-primary hover:bg-primaryHover text-white font-bold rounded-lg text-sm shadow-md transition">
          Create Account
        </button>
      </form>

      <div class="mt-6 flex items-center justify-center gap-4">
        <div class="h-px bg-gray-200 dark:bg-gray-800 flex-1"></div>
        <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Or continue with</span>
        <div class="h-px bg-gray-200 dark:bg-gray-800 flex-1"></div>
      </div>

      <div class="mt-6 grid grid-cols-2 gap-4">
        <button type="button" class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg text-sm font-semibold text-secondary dark:text-gray-200 hover:bg-[#4285F4]/5 dark:hover:bg-[#4285F4]/10 hover:text-[#4285F4] hover:border-[#4285F4]/30 dark:hover:border-[#4285F4]/50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg text-sm font-semibold text-secondary dark:text-gray-200 hover:bg-black hover:text-white hover:border-black dark:hover:bg-white dark:hover:text-black dark:hover:border-white hover:scale-[1.02] active:scale-[0.98] transition-all duration-300">
          <svg class="w-4 h-4" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          Apple
        </button>
      </div>

      <div class="mt-6 pt-6 border-t border-gray-100 dark:border-gray-800 text-center">
        <p class="text-xs text-gray-500 font-medium">
          Already have a portal account? 
          <a href="login.html" class="text-primary font-bold hover:underline">Log In</a>
        </p>
      </div>

    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
